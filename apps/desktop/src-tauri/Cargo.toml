[package]
name = "personal-copilot-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
copilot-core.workspace = true
copilot-audio.workspace = true
futures-util = { version = "0.3", default-features = false, features = ["std"] }
http-body-util = "0.1"
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
reqwest = { version = "0.13", default-features = false, features = ["native-tls", "json", "form"] }
ring = "0.17"
rusqlite = { version = "0.41", features = ["bundled"] }
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
tempfile = "3"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "sync", "time"] }
uuid = { version = "1", features = ["v4"] }
# DOCX import reads word/document.xml only; Word stores it with deflate.
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }
pdf-extract = "0.12.1"

[target.'cfg(windows)'.dependencies]
# Same version Tauri's WebView2 backend uses; only for the hidden-window memory hint.
webview2-com = "0.39"
# Direct `links` dependency: its build script fetches the DLLs that
# tauri.windows.conf.json bundles before tauri-build checks they exist.
sherpa-onnx-sys = { version = "=2.0.1", default-features = false }
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Security_Cryptography",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
